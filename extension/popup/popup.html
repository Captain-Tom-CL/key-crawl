<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Crawl</title>
    <link rel="stylesheet" href="../shared/ui.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="popup-shell">
        <header class="popup-header">
            <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5v14M18 5l-7 7 7 7M5 12h6"/></svg></div>
            <div class="title-block">
                <p>Key Crawl</p>
                <span>把网页，变成有用的信息。</span>
            </div>
            <button id="openOptions" class="icon-button" type="button" title="打开设置" aria-label="打开设置"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/></svg></button>
        </header>

        <div class="workflow" aria-label="采集流程">
            <span><b>1</b> 打开页面</span><span class="workflow-line" aria-hidden="true"></span>
            <span><b>2</b> 发送内容</span><span class="workflow-line" aria-hidden="true"></span>
            <span><b>3</b> 开始分析</span>
        </div>

        <section class="control-panel">
            <div class="control-heading"><h1>从当前页面开始</h1><span class="tag">批量采集</span></div>
            <label for="anchorSelector">链接选择器 <span>CSS SELECTOR</span></label>
            <div class="selector-row">
                <input id="anchorSelector" type="text" placeholder="例如：.article-list a" spellcheck="false" aria-describedby="selectorHint" autocomplete="off">
                <button id="openLinks" class="button button-primary" type="button">批量打开</button>
            </div>
            <p class="hint" id="selectorHint">匹配的链接将在后台打开，随后可发送到本地服务。</p>
        </section>

        <section class="queue-panel" aria-labelledby="queueTitle">
            <div class="queue-heading">
                <div class="queue-title">
                    <h2 id="queueTitle">采集队列</h2>
                    <span id="queueCount" class="count" aria-label="队列页面数量">0</span>
                </div>
                <div class="queue-actions">
                    <button id="openResults" class="results-button" type="button">查看结果 <span aria-hidden="true">↗</span></button>
                </div>
            </div>
            <div id="emptyState" class="empty-state">
                <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="18" height="23" rx="3"/><path d="M5 23H4a2 2 0 0 1-2-2V5a3 3 0 0 1 3-3h15M13 12h8m-8 5h8m-8 5h4"/></svg></div>
                <p>还没有待采集的页面</p>
                <span>填入选择器，点击「批量打开」开始。</span>
            </div>
            <ol id="tabList" class="tab-list" hidden></ol>
        </section>

        <footer class="popup-footer">
            <p id="status" class="status" role="status" aria-live="polite">准备就绪</p>
            <p id="analysisStatus" class="status" role="status" aria-live="polite">正在查询分析状态…</p>
            <div class="footer-actions">
                <button id="sendPages" class="button button-secondary" type="button" disabled>批量发送</button>
                <button id="analyzePages" class="button button-primary" type="button" disabled>查询状态中…</button>
            </div>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>

</html>
