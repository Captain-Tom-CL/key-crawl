<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Crawl</title>
    <link rel="stylesheet" href="prompt.css">
</head>

<body>
    <main class="popup-shell">
        <header class="popup-header">
            <div class="brand-mark" aria-hidden="true">K</div>
            <div class="title-block">
                <p>KEY CRAWL</p>
                <h1>页面批量采集</h1>
            </div>
            <button id="openOptions" class="icon-button" type="button" title="打开设置" aria-label="打开设置">⚙</button>
        </header>

        <section class="control-panel">
            <label for="anchorSelector">链接选择器</label>
            <div class="selector-row">
                <input id="anchorSelector" type="text" placeholder="例如：.article-list a" spellcheck="false">
                <button id="openLinks" class="button button-primary" type="button">批量打开</button>
            </div>
            <p class="hint">从当前页面提取匹配元素的链接，并在后台标签页中打开。</p>
        </section>

        <section class="queue-panel" aria-labelledby="queueTitle">
            <div class="queue-heading">
                <div>
                    <p class="section-label">采集队列</p>
                    <h2 id="queueTitle">已打开页面</h2>
                </div>
                <span id="queueCount" class="count">0</span>
            </div>
            <div id="emptyState" class="empty-state">尚未打开页面</div>
            <ol id="tabList" class="tab-list" hidden></ol>
        </section>

        <footer class="popup-footer">
            <p id="status" class="status" role="status" aria-live="polite">准备就绪</p>
            <button id="sendPages" class="button button-send" type="button" disabled>批量发送</button>
            <button id="analyzePages" class="button button-analyze" type="button">开始分析</button>
        </footer>
    </main>

    <script src="prompt.js"></script>
</body>

</html>
