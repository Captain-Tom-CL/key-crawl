name: Package and release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-and-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Package application
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" `
            ./build/artifacts/key-crawl.exe `
            ./build/artifacts/extension.zip `
            ./build/artifacts/extension-version.txt `
            --target "$(git rev-parse HEAD)" `
            --title "Key Crawl build ${{ github.run_number }}" `
            --latest `
            --generate-notes
