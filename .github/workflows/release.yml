name: Package and release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-and-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Package application
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content ./build/artifacts/version.txt -Raw).Trim()
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/cmd/key-crawl/main.go
          git commit -m "chore: bump version to ${{ steps.version.outputs.value }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          gh release create "v$version" `
            ./build/artifacts/version.txt `
            ./build/artifacts/key-crawl.exe `
            ./build/artifacts/extension.zip `
            ./build/release/key-crawl-$version.zip `
            --target "$(git rev-parse HEAD)" `
            --title "Key Crawl v$version" `
            --generate-notes
