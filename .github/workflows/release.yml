name: Package and release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-and-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Package application
        shell: pwsh
        env:
          KEY_CRAWL_BEFORE_SHA: ${{ github.event.before }}
        run: ./scripts/package.ps1

      - name: Commit extension version bump
        shell: pwsh
        run: |
          git diff --quiet -- extension/manifest.json
          if ($LASTEXITCODE -eq 1) {
            $version = ([string]((Get-Content ./extension/manifest.json -Raw | ConvertFrom-Json).version)).Trim()
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- extension/manifest.json
            git commit -m "chore: bump extension version to $version [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          }
          elseif ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect extension/manifest.json changes."
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" `
            ./build/artifacts/key-crawl.exe `
            ./build/artifacts/extension.zip `
            ./build/artifacts/extension-version.txt `
            --target "$(git rev-parse HEAD)" `
            --title "Key Crawl build ${{ github.run_number }}" `
            --latest `
            --generate-notes
